<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f2e5" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>Genkou Youshi</title>
    <style>
      :root {
        color: #211e19;
        background: #d9d4c8;
        font-family: Inter, ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 20% 10%, rgba(255, 255, 255, 0.65), transparent 32%),
          linear-gradient(135deg, #f7f2e5, #d9d4c8);
      }

      main {
        width: min(680px, 100%);
        padding: clamp(32px, 7vw, 72px);
        border: 1px solid rgba(33, 30, 25, 0.1);
        border-radius: 8px;
        background: rgba(251, 247, 232, 0.78);
        box-shadow: 0 24px 70px rgba(45, 39, 30, 0.12);
        text-align: center;
      }

      .seal {
        display: grid;
        width: 64px;
        height: 64px;
        margin: 0 auto 28px;
        place-items: center;
        border-radius: 5px;
        background: #b93327;
        color: #fbf7e8;
        font-family: ui-serif, Georgia, serif;
        font-size: 32px;
        font-weight: 800;
      }

      .eyebrow {
        margin: 0 0 10px;
        color: #858070;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.18em;
      }

      h1 {
        margin: 0;
        font-family: ui-serif, Georgia, serif;
        font-size: clamp(36px, 8vw, 62px);
        line-height: 1;
        letter-spacing: -0.04em;
      }

      .intro {
        max-width: 480px;
        margin: 22px auto 32px;
        color: #575147;
        font-size: 17px;
        line-height: 1.65;
      }

      .open-app {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        justify-content: center;
        padding: 0 24px;
        border-radius: 5px;
        background: #2e454f;
        color: #fbf7e8;
        font-size: 14px;
        font-weight: 750;
        text-decoration: none;
      }

      .open-app:hover { background: #22373f; }
      .open-app:focus-visible { outline: 3px solid #b93327; outline-offset: 3px; }

      .placeholder {
        margin: 24px 0 0;
        color: #858070;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="seal" aria-hidden="true">原</div>
      <p class="eyebrow">GENKOU YOUSHI</p>
      <h1>Practice Japanese writing.</h1>
      <p class="intro">A quiet workspace for handwriting practice on traditional Japanese manuscript paper.</p>
      <a class="open-app" href="/app/">Open the app</a>
      <p class="placeholder">More information is coming soon.</p>
    </main>
  </body>
</html>
